<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿甘小助手（流式打字动画版）</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
    }
    h1 { margin-top: 20px; }
    #chat-box {
      width: 90%;
      max-width: 600px;
      height: 70vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .msg { margin: 5px 0; padding: 10px 15px; border-radius: 12px; max-width: 80%; }
    .user { align-self: flex-end; background: #0078ff; color: white; }
    .bot { align-self: flex-start; background: #e9ecef; color: #000; white-space: pre-wrap; }
    #input-area { width: 90%; max-width: 600px; display: flex; margin-top: 10px; }
    #input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
    #send { padding: 10px 20px; margin-left: 10px; border: none; background: #0078ff; color: white; border-radius: 8px; cursor: pointer; }
    #send:hover { background: #005fcc; }
    .typing {
      display: inline-block;
      animation: blink 1s infinite;
      color: #999;
      margin-left: 4px;
    }
    @keyframes blink {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>阿甘小助手（流式输出）</h1>
  <div id="chat-box"></div>
  <div id="input-area">
    <input id="input" type="text" placeholder="输入点什么..." />
    <button id="send">发送</button>
  </div>

<script>
  const BOT_ID = "7568773837157253158";
  const TOKEN = "pat_ipKqdzM3rRO9j91v1t6Q57jzeP8vlK6aNms5PJb8PQEtbNsvLQBvqQ2aBcWNDJPw";
  const chatBox = document.getElementById("chat-box");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function appendMessage(sender, text = "") {
    const msg = document.createElement("div");
    msg.classList.add("msg", sender);
    msg.textContent = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  function addTypingIndicator() {
    const indicator = document.createElement("div");
    indicator.classList.add("msg", "bot");
    indicator.innerHTML = "阿甘正在输入中<span class='typing'>...</span>";
    chatBox.appendChild(indicator);
    chatBox.scrollTop = chatBox.scrollHeight;
    return indicator;
  }

  async function sendToCozeStream(text) {
    appendMessage("user", text);
    input.value = "";

    const typingIndicator = addTypingIndicator();

    try {
      const response = await fetch("https://api.coze.cn/open_api/v2/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${TOKEN}`
        },
        body: JSON.stringify({
          bot_id: BOT_ID,
          user: "web_user_1",
          query: text,
          stream: true
        })
      });

      if (!response.ok) {
        typingIndicator.textContent = `❌ 错误：${response.status}`;
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let botMsg = appendMessage("bot", "");
      typingIndicator.remove();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const chunks = buffer.split("\n\n");
        buffer = chunks.pop();

        for (const chunk of chunks) {
          if (!chunk.startsWith("data:")) continue;
          const jsonStr = chunk.slice(5).trim();
          if (jsonStr === "[DONE]") return;
          try {
            const data = JSON.parse(jsonStr);

            // ✅ 只显示真正文本回答，过滤插件、函数、tool 调用
            if (
              data.message &&
              data.message.type === "answer" &&
              !/调用|函数|Ai_TRAVEL|plugin|tool_call/i.test(data.message.content)
            ) {
              botMsg.textContent += data.message.content;
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          } catch (_) {}
        }
      }
    } catch (err) {
      typingIndicator.textContent = "❌ 网络错误：" + err.message;
    }
  }

  send.addEventListener("click", () => {
    const text = input.value.trim();
    if (!text) return;
    sendToCozeStream(text);
  });

  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") send.click();
  });
</script>
</body>
</html>
