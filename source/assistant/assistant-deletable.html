<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>阿甘助手</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; padding:0; font-family:Arial, sans-serif; background:#f5f5f5; }
    #chat-container { display:flex; flex-direction:column; height:100vh; }
    #chat-header { padding:10px; background:#2d2d2d; color:#fff; text-align:center; }
    #chat-messages { flex:1; padding:10px; overflow-y:auto; background:#ffffff; }
    .message { margin:8px 0; max-width:80%; }
    .message.user { align-self:flex-end; background:#cce5ff; padding:8px; border-radius:8px; }
    .message.bot { align-self:flex-start; background:#e9ecef; padding:8px; border-radius:8px; }
    #chat-input { display:flex; padding:10px; background:#fff; }
    #chat-input input[type=text] { flex:1; padding:8px; border:1px solid #ccc; border-radius:4px; }
    #chat-input button { margin-left:8px; padding:8px 12px; border:none; background:#007bff; color:#fff; border-radius:4px; cursor:pointer; }
    #chat-footer { text-align:center; padding:5px; font-size:12px; color:#666; }
    #btn-clear { position:absolute; top:10px; right:10px; padding:4px 8px; background:#ff4d4f; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="chat-header">
      阿甘助手
      <button id="btn-clear">新会话</button>
    </div>
    <div id="chat-messages">
      <!-- 聊天记录将插入这里 -->
    </div>
    <div id="chat-input">
      <input type="text" id="input-msg" placeholder="输入你的问题..." />
      <button id="btn-send">发送</button>
    </div>
    <div id="chat-footer">Powered by Coze</div>
  </div>

  <!-- 保持你的 Coze 脚本引用，不改动其初始化和通信逻辑 -->
  <script src="path/to/coze-widget.js"></script>
  <script>
    // 初始欢迎语
    addBotMessage("你好，我是阿甘助手，有什么可以帮你？");

    // 获取 DOM 元素
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('input-msg');
    const btnSend = document.getElementById('btn-send');
    const btnClear = document.getElementById('btn-clear');

    btnSend.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
    btnClear.addEventListener('click', clearConversation);

    function sendMessage(){
      const text = inputEl.value.trim();
      if (!text) return;
      addUserMessage(text);
      inputEl.value = '';
      scrollToBottom();

      // 调用 Coze 接口发送消息
      coze.send(text).then(response => {
        addBotMessage(response);
        scrollToBottom();
      }).catch(err => {
        addBotMessage("抱歉，出错了 :(");
        scrollToBottom();
      });
    }

    function addUserMessage(text){
      const div = document.createElement('div');
      div.className = 'message user';
      div.textContent = text;
      messagesEl.appendChild(div);
    }

    function addBotMessage(text){
      const div = document.createElement('div');
      div.className = 'message bot';
      div.textContent = text;
      messagesEl.appendChild(div);
    }

    function clearConversation(){
      messagesEl.innerHTML = '';
      addBotMessage("你好，我是阿甘助手，有什么可以帮你？");
      scrollToBottom();
    }

    function scrollToBottom(){
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  </script>
</body>
</html>
