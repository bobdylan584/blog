<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐空间 - 酷狗风格播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed; /* 关键修复：完全固定页面 */
            width: 100%;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .music-player {
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transform: translateZ(0); /* 硬件加速 */
            will-change: transform; /* 性能优化 */
        }

        .player-header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 20px 30px;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .player-body {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 300px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
            position: relative;
        }

        .playlist {
            list-style: none;
        }

        .playlist li {
            padding: 12px;
            margin: 6px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            transform: translateZ(0); /* 硬件加速 */
        }

        .main-content {
            flex: 1;
            padding: 20px;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .album-art {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .album-art img {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            object-fit: cover;
            display: block; /* 防止图片基线对齐问题 */
        }

        .song-info {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .progress-area {
            margin: 20px 0;
            flex-shrink: 0;
            position: relative;
        }

        .progress-bar {
            height: 5px;
            background: #ecf0f1;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            position: relative;
            transform: translateZ(0);
        }

        .progress {
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 8px;
            width: 0%;
            transition: width 0.1s ease;
            transform: translateZ(0);
        }

        .time {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 0.8em;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 20px 0;
            flex-shrink: 0;
            position: relative;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(0);
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        .control-btn.play-pause {
            width: 60px;
            height: 60px;
            font-size: 1.3em;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            flex-shrink: 0;
        }

        .volume-slider {
            flex: 1;
            height: 3px;
            background: #ecf0f1;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transform: translateZ(0);
        }

        .volume-progress {
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 8px;
            width: 80%;
            transform: translateZ(0);
        }

        .lyrics-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            position: relative;
            transform: translateZ(0);
        }

        .lyrics {
            text-align: center;
            line-height: 1.8;
            color: #2c3e50;
        }

        .lyrics .current {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 1em;
        }

        /* 音频元素样式优化 */
        #audioPlayer {
            position: fixed !important; /* 关键修复：将音频元素移出文档流 */
            top: -9999px !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0.001 !important;
            pointer-events: none !important;
            z-index: -9999 !important;
        }

        /* 自定义滚动条 */
        .sidebar::-webkit-scrollbar,
        .lyrics-container::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track,
        .lyrics-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .lyrics-container::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 107, 0.5);
            border-radius: 3px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            
            .music-player {
                max-height: 95vh;
            }
            
            .player-body {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                max-height: 200px;
                order: 2;
            }
            
            .main-content {
                order: 1;
            }
            
            .album-art img {
                width: 150px;
                height: 150px;
            }
        }

        /* 防止所有可能的滚动和抖动 */
        body.prevent-scroll {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div class="music-player">
        <div class="player-header">
            <h1>🎵 我的音乐空间</h1>
            <p>享受音乐的每一刻</p>
        </div>
        
        <div class="player-body">
            <div class="sidebar">
                <h3 style="margin-bottom: 15px; color: #ff6b6b;">播放列表</h3>
                <ul class="playlist">
                    <li class="active">
                        <span class="song-number">1</span>
                        <div>
                            <div class="song-name">我要你默默走不回头</div>
                            <div class="artist-name">队长的小斑鸠、向晚晚</div>
                        </div>
                    </li>
                    <li>
                        <span class="song-number">2</span>
                        <div>
                            <div class="song-name">万千花蕊慈母悲哀</div>
                            <div class="artist-name">珂拉琪</div>
                        </div>
                    </li>
                    <li>
                        <span class="song-number">3</span>
                        <div>
                            <div class="song-name">晴天</div>
                            <div class="artist-name">周杰伦</div>
                        </div>
                    </li>
                    <li>
                        <span class="song-number">4</span>
                        <div>
                            <div class="song-name">光年之外</div>
                            <div class="artist-name">邓紫棋</div>
                        </div>
                    </li>
                </ul>
            </div>
            
            <div class="main-content">
                <div class="album-art">
                    <img src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/audio/album-cover.jpg" alt="专辑封面" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjUwIiBoZWlnaHQ9IjI1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzQzOTRGIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgZmlsbD0iI0ZGRiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuWbvuWDj+Wkp+WtpjwvdGV4dD48L3N2Zz4='">
                </div>
                
                <div class="song-info">
                    <h1 class="song-title">我要你默默走不回头</h1>
                    <div class="song-artist">队长的小斑鸠、向晚晚</div>
                </div>
                
                <div class="progress-area">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time">
                        <span class="current-time" id="currentTime">0:00</span>
                        <span class="total-time" id="totalTime">0:00</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" id="prevBtn">⏮</button>
                    <button class="control-btn play-pause" id="playPauseBtn">▶</button>
                    <button class="control-btn" id="nextBtn">⏭</button>
                </div>
                
                <div class="volume-control">
                    <span>🔊</span>
                    <div class="volume-slider" id="volumeSlider">
                        <div class="volume-progress" id="volumeProgress"></div>
                    </div>
                </div>
                
                <div class="lyrics-container">
                    <div class="lyrics" id="lyrics">
                        <div class="current">我要你默默走不回头</div>
                        <div>就这样消失在街的尽头</div>
                        <div>不要回头看我泪流</div>
                        <div>就让回忆随风飘走</div>
                        <div>我要你默默走不回头</div>
                        <div>就这样消失在夜的尽头</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 关键修复：将音频元素完全移出可视区域 -->
    <audio id="audioPlayer" style="position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0.001; pointer-events: none;">
        <source src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/audio/%E9%98%9F%E9%95%BF%E7%9A%84%E5%B0%8F%E6%96%91%E9%B8%A0%E3%80%81%E5%90%91%E6%99%9A%E6%99%9A%20-%20%E6%88%91%E8%A6%81%E4%BD%A0%E9%BB%98%E9%BB%98%E8%B5%B0%E4%B8%8D%E5%9B%9E%E5%A4%B4%20(%E8%AF%B4%E5%94%B1%E7%89%88).mp3" type="audio/mpeg">
        您的浏览器不支持音频元素
    </audio>

    <script>
        // 立即阻止所有可能的滚动行为
        document.addEventListener('DOMContentLoaded', function() {
            // 完全禁用页面滚动
            document.body.classList.add('prevent-scroll');
            
            // 阻止所有触摸滚动
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            // 阻止鼠标滚轮
            document.addEventListener('wheel', function(e) {
                e.preventDefault();
            }, { passive: false });
        });

        // 获取DOM元素
        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeProgress = document.getElementById('volumeProgress');
        const playlistItems = document.querySelectorAll('.playlist li');
        const lyrics = document.getElementById('lyrics');

        // 音频事件监听优化 - 使用requestAnimationFrame减少重绘
        let lastUpdateTime = 0;
        const updateInterval = 100; // 100ms更新一次

        audioPlayer.addEventListener('timeupdate', () => {
            const now = Date.now();
            if (now - lastUpdateTime < updateInterval) return;
            lastUpdateTime = now;

            const currentTime = audioPlayer.currentTime;
            const duration = audioPlayer.duration;
            
            if (duration && duration > 0) {
                const progressPercent = (currentTime / duration) * 100;
                // 使用transform而不是width改变来避免重排
                progress.style.width = `${progressPercent}%`;
                
                currentTimeEl.textContent = formatTime(currentTime);
                totalTimeEl.textContent = formatTime(duration);
            }
        });

        // 播放/暂停功能
        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            
            if (audioPlayer.paused) {
                // 预加载音频以减少播放时的卡顿
                audioPlayer.load();
                audioPlayer.play().then(() => {
                    playPauseBtn.innerHTML = '⏸';
                }).catch(error => {
                    console.log('播放失败:', error);
                    playPauseBtn.innerHTML = '▶';
                });
            } else {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '▶';
            }
        });

        // 进度条点击
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        // 音量控制
        volumeSlider.addEventListener('click', (e) => {
            const rect = volumeSlider.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.volume = Math.max(0, Math.min(1, percent));
            volumeProgress.style.width = `${percent * 100}%`;
        });

        // 播放列表点击
        playlistItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                playlistItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                const songName = item.querySelector('.song-name').textContent;
                const artistName = item.querySelector('.artist-name').textContent;
                
                document.querySelector('.song-title').textContent = songName;
                document.querySelector('.song-artist').textContent = artistName;
                
                audioPlayer.play().catch(console.error);
                playPauseBtn.innerHTML = '⏸';
            });
        });

        // 格式化时间
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        // 初始化音量
        audioPlayer.volume = 0.8;
        volumeProgress.style.width = '80%';

        // 预加载音频
        audioPlayer.load();

        console.log('页面已完全固定，音频播放不会导致滚动问题');
    </script>
</body>
</html>
