<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐空间 - 移动端优化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .music-player {
            width: 100%;
            height: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .player-header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .player-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .player-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .player-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            background: #2c3e50;
            color: white;
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
            max-height: 40vh;
        }

        .playlist {
            list-style: none;
        }

        .playlist li {
            padding: 12px;
            margin: 6px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .playlist li:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist li.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        .playlist .song-number {
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 0.7em;
        }

        .main-content {
            flex: 1;
            padding: 15px;
            background: white;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* 改善移动端滚动体验 */
        }

        .album-art {
            text-align: center;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .album-art img {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }

        .song-info {
            text-align: center;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .song-title {
            font-size: 1.4em;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .song-artist {
            font-size: 1em;
            color: #7f8c8d;
        }

        .progress-area {
            margin: 15px 0;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 5px;
            background: #ecf0f1;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            position: relative;
        }

        .progress {
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 8px;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 0.8em;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
            flex-shrink: 0;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .control-btn.play-pause {
            width: 60px;
            height: 60px;
            font-size: 1.3em;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            flex-shrink: 0;
        }

        .volume-slider {
            flex: 1;
            height: 3px;
            background: #ecf0f1;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
        }

        .volume-progress {
            height: 100%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 8px;
            width: 80%;
        }

        .lyrics-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* 改善移动端滚动体验 */
        }

        .lyrics {
            text-align: center;
            line-height: 1.8;
            color: #2c3e50;
        }

        .lyrics .current {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 1em;
        }

        /* 自定义滚动条 */
        .sidebar::-webkit-scrollbar,
        .lyrics-container::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track,
        .lyrics-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .lyrics-container::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 107, 0.5);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        .lyrics-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 107, 107, 0.7);
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            body {
                padding: 5px;
                align-items: flex-start;
            }
            
            .music-player {
                height: 98vh;
                max-height: 98vh;
            }
            
            .player-header {
                padding: 12px 15px;
            }
            
            .player-header h1 {
                font-size: 1.3em;
            }
            
            .album-art img {
                width: 150px;
                height: 150px;
            }
            
            .sidebar {
                max-height: 30vh;
            }
        }

        /* 防止移动端下拉刷新 */
        @media (max-width: 768px) {
            body {
                overscroll-behavior: none;
            }
        }
    </style>
</head>
<body>
    <div class="music-player">
        <div class="player-header">
            <div>
                <h1>🎵 我的音乐空间</h1>

        <div class="player-body">
            <div class="sidebar">
                <h3 style="margin-bottom: 15px; color: #ff6b6b;">播放列表</h3>
                <ul class="playlist">
                    <li class="active" data-src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/audio/%E9%98%9F%E9%95%BF%E7%9A%84%E5%B0%8F%E6%96%91%E9%B8%A0%E3%80%81%E5%90%91%E6%99%9A%E6%99%9A%20-%20%E6%88%91%E8%A6%81%E4%BD%A0%E9%BB%98%E9%BB%98%E8%B5%B0%E4%B8%8D%E5%9B%9E%E5%A4%B4%20(%E8%AF%B4%E5%94%B1%E7%89%88).mp3" data-title="我要你默默走不回头" data-artist="队长的小斑鸠、向晚晚" data-cover="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg">
                        <span class="song-number">1</span>

                            <div class="artist-name">队长的小斑鸠、向晚晚</div>

                    </li>
                    <li data-src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/audio/%E9%82%B5%E5%B8%85%20-%20%E6%9A%96%E4%B8%80%E6%9D%AF%E8%8C%B6.mp3" data-title="暖一杯茶" data-artist="邵帅" data-cover="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg">

                            <div class="song-name">暖一杯茶</div>
                            <div class="artist-name">邵帅</div>
                        </div>
                    </li>
                    <li data-src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/audio/ZaZaZsu%E5%92%82%E5%92%82%E8%8B%8F%20-%20%E7%88%B1%E6%B2%B3.mp3" data-title="爱河" data-artist="ZaZaZsu咂咂苏" data-cover="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg">
                        <span class="song-number">3</span>
                        <div>
                            <div class="song-name">爱河</div>
                            <div class="artist-name">ZaZaZsu咂咂苏</div>
                        </div>
                    </li>
                    <li data-src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/audio/%E7%8E%8B%E9%93%AE%E4%BA%AE%20-%20%E4%B8%8D%E5%87%A1.mp3" data-title="不凡" data-artist="王铮亮" data-cover="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg">
                        <span class="song-number">4</span>
                        <div>
                            <div class="song-name">不凡</div>
                            <div class="artist-name">王铮亮</div>
                        </div>
                    </li>
                </ul>
            </div>
            
            <div class="main-content">
                <div class="album-art">
                    <img id="albumCover" src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg" alt="专辑封面" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjUwIiBoZWlnaHQ9IjI1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzQzOTRGIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIyNCIgZmlsbD0iI0ZGRiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuWbvuWDj+Wkp+WtpjwvdGV4dD48L3N2Zz4='">
                </div>
                
                <div class="song-info">
                    <h1 class="song-title" id="songTitle">我要你默默走不回头</h1>
                    <div class="song-artist" id="songArtist">队长的小斑鸠、向晚晚</div>
                </div>
                
                <div class="progress-area">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time">
                        <span class="current-time" id="currentTime">0:00</span>
                        <span class="total-time" id="totalTime">0:00</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="control-btn" id="prevBtn">⏮</button>
                    <button class="control-btn play-pause" id="playPauseBtn">▶</button>
                    <button class="control-btn" id="nextBtn">⏭</button>
                </div>
                
                <div class="volume-control">
                    <span>🔊</span>
                    <div class="volume-slider" id="volumeSlider">
                        <div class="volume-progress" id="volumeProgress"></div>
                    </div>
                </div>
                
                <div class="lyrics-container">
                    <div class="lyrics" id="lyrics">
                        <div class="current">我要你默默走不回头</div>
                        <div>就这样消失在街的尽头</div>
                        <div>不要回头看我泪流</div>
                        <div>就让回忆随风飘走</div>
                        <div>我要你默默走不回头</div>
                        <div>就这样消失在夜的尽头</div>
                        <div>心中的痛无法挽留</div>
                        <div>就让时间带走所有</div>
                        <div>曾经的誓言已不再</div>
                        <div>我们的爱已成过去</div>
                        <div>虽然心中还有不舍</div>
                        <div>但我知道这是结局</div>
                    </div>
                </div>
                
                <!-- 隐藏的音频元素 -->
                <audio id="audioPlayer" style="display: none;">
                    <source src="https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/audio/%E9%98%9F%E9%95%BF%E7%9A%84%E5%B0%8F%E6%96%91%E9%B8%A0%E3%80%81%E5%90%91%E6%99%9A%E6%99%9A%20-%20%E6%88%91%E8%A6%81%E4%BD%A0%E9%BB%98%E9%BB%98%E8%B5%B0%E4%B8%8D%E5%9B%9E%E5%A4%B4%20(%E8%AF%B4%E5%94%B1%E7%89%88).mp3" type="audio/mpeg">
                    您的浏览器不支持音频元素
                </audio>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeProgress = document.getElementById('volumeProgress');
        const playlistItems = document.querySelectorAll('.playlist li');
        const lyrics = document.getElementById('lyrics');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const albumCover = document.getElementById('albumCover');

        // 当前播放的歌曲索引
        let currentSongIndex = 0;

        // 播放/暂停功能
        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play().catch(e => {
                    console.log('自动播放被阻止，需要用户交互');
                    playPauseBtn.innerHTML = '▶';
                });
                playPauseBtn.innerHTML = '⏸';
            } else {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '▶';
            }
        });

        // 进度条更新
        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;
            const duration = audioPlayer.duration;
            
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progress.style.width = `${progressPercent}%`;
                
                // 更新时间显示
                currentTimeEl.textContent = formatTime(currentTime);
                totalTimeEl.textContent = formatTime(duration);
                
                // 歌词高亮（简单模拟）
                updateLyricsHighlight(currentTime);
            }
        });

        // 点击进度条跳转
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        // 音量控制
        volumeSlider.addEventListener('click', (e) => {
            const rect = volumeSlider.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.volume = Math.max(0, Math.min(1, percent));
            volumeProgress.style.width = `${percent * 100}%`;
        });

        // 播放列表点击
        playlistItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                playSong(index);
            });
        });

        // 上一首
        prevBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex - 1 + playlistItems.length) % playlistItems.length;
            playSong(currentSongIndex);
        });

        // 下一首
        nextBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex + 1) % playlistItems.length;
            playSong(currentSongIndex);
        });

        // 播放指定索引的歌曲
        function playSong(index) {
            // 更新当前歌曲索引
            currentSongIndex = index;
            
            // 获取歌曲数据
            const songItem = playlistItems[index];
            const src = songItem.getAttribute('data-src');
            const title = songItem.getAttribute('data-title');
            const artist = songItem.getAttribute('data-artist');
            const cover = songItem.getAttribute('data-cover');
            
            // 更新音频源
            audioPlayer.src = src;
            
            // 更新UI
            songTitle.textContent = title;
            songArtist.textContent = artist;
            albumCover.src = cover;
            
            // 更新播放列表高亮
            playlistItems.forEach(item => item.classList.remove('active'));
            songItem.classList.add('active');
            
            // 播放歌曲
            audioPlayer.play().catch(e => {
                console.log('需要用户交互才能播放');
            });
            playPauseBtn.innerHTML = '⏸';
            
            // 重置进度条
            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        }

        // 格式化时间
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        // 歌词高亮更新（模拟）
        function updateLyricsHighlight(currentTime) {
            const lines = lyrics.querySelectorAll('div');
            const currentLine = Math.floor(currentTime / 5) % lines.length; // 每5秒切换一行
            
            lines.forEach((line, index) => {
                line.classList.remove('current');
                if (index === currentLine) {
                    line.classList.add('current');
                    // 平滑滚动到当前歌词
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        // 初始化音量
        audioPlayer.volume = 0.8;
        volumeProgress.style.width = '80%';

        // 移动端触摸事件处理
        document.addEventListener('touchstart', function(e) {
            // 允许在可滚动区域内的触摸事件
            if (e.target.closest('.sidebar') || e.target.closest('.lyrics-container') || e.target.closest('.main-content')) {
                return;
            }
        }, { passive: true });
    </script>
</body>
</html>
