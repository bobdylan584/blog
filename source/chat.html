<!DOCTYPE html>
<html>
<head>
    <title>AI聊天助手</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 20px auto; padding: 20px; }
        #chat-messages { height: 300px; border: 1px solid #ccc; overflow: auto; margin: 10px 0; padding: 10px; }
        .user { color: blue; margin: 5px 0; }
        .assistant { color: green; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>AI聊天助手</h1>
    
    <div id="chat-messages"></div>
    <input type="text" id="user-input" placeholder="输入问题..." style="width: 70%; padding: 8px;">
    <button onclick="sendMessage()" style="width: 25%; padding: 8px;">发送</button>

    <script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const message = input.value;
        
        if (!message) return;
        
        addMessage('user', message);
        input.value = '请求中...';
        input.disabled = true;
        
        try {
            const response = await fetch('https://api.coze.cn/v1/workflow/stream_run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer cztei_qfG4aUK3AqpvpWlXxrz9DpI5agImzf6OXHd4NGcDqo1qEDNHbUtV5gzeH0aFhbhWm',
                },
                body: JSON.stringify({
                    workflow_id: "7537601708483346432",
                    parameters: { input: message }
                })
            });
            
            // 处理流式响应
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullResponse = '';
            
            addMessage('assistant', ''); // 创建空消息容器
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const dataStr = line.slice(6); // 去掉 'data: ' 前缀
                            if (dataStr === '[DONE]') break;
                            
                            const data = JSON.parse(dataStr);
                            if (data.event === 'text' && data.text) {
                                fullResponse += data.text;
                                // 更新最后一条消息的内容
                                const messages = document.getElementById('chat-messages');
                                const lastMessage = messages.lastChild;
                                lastMessage.textContent = 'AI: ' + fullResponse;
                                messages.scrollTop = messages.scrollHeight;
                            }
                        } catch (e) {
                            // 忽略单行解析错误
                        }
                    }
                }
            }
            
            input.value = '';
            input.disabled = false;
            
        } catch (error) {
            input.value = '';
            input.disabled = false;
            addMessage('assistant', '请求错误: ' + error.message);
        }
    }
    
    function addMessage(role, content) {
        const container = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = role;
        msgDiv.textContent = (role === 'user' ? '你: ' : 'AI: ') + content;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    document.getElementById('user-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
    </script>
</body>
</html>
