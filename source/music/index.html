<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>🎵 在线音乐播放器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
  <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f9fafc 0%, #e3ebf6 100%);
      color: #222;
      text-align: center;
      padding: 40px 10px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    p.desc {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }
    button {
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 20px;
    }
    button:hover { background: #005fa3; }

    #aplayer {
      margin: 0 auto;
      max-width: 700px;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
      border-radius: 10px;
      background: #fff;
    }

    #loading {
      font-size: 15px;
      color: #555;
      margin-top: 20px;
      display: none;
    }

    /* 夜间模式适配 */
    [data-theme="dark"] body {
      background: #1e1e1e;
      color: #ccc;
    }
    [data-theme="dark"] #aplayer {
      background: #2a2a2a;
    }
  </style>
</head>

<body>
  <h1>🎧 在线音乐播放器</h1>
  <p class="desc">从阿里云 OSS 自动读取音乐列表</p>
  <button id="reloadBtn">🔄 重新加载音乐列表</button>
  <div id="aplayer"></div>
  <p id="loading">加载中，请稍候...</p>

  <script>
    const listUrl = "https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/mp3/list.json";
    const defaultCover = "https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg";

    const aplayer = new APlayer({
      container: document.getElementById("aplayer"),
      autoplay: false,
      loop: "all",
      order: "random",
      listFolded: false,
      preload: "none",
      fixed: false,
      audio: []
    });

    async function loadMusicList() {
      const loading = document.getElementById("loading");
      loading.style.display = "block";
      loading.textContent = "正在加载音乐列表...";

      try {
        const res = await fetch(listUrl + "?_=" + Date.now());
        if (!res.ok) throw new Error("无法加载 list.json");

        const data = await res.json();
        aplayer.list.clear();

        data.forEach(item => {
          aplayer.list.add({
            name: item.title,
            artist: "未知",
            url: item.url,
            cover: item.cover || defaultCover
          });
        });

        loading.textContent = `✅ 已加载 ${data.length} 首歌曲`;
        setTimeout(() => (loading.style.display = "none"), 1500);

      } catch (err) {
        loading.textContent = "❌ 加载失败，请检查 OSS 配置。";
        console.error(err);
      }
    }

    document.getElementById("reloadBtn").addEventListener("click", loadMusicList);
    loadMusicList();
  </script>
</body>
</html>
