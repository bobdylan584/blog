<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 音乐播放器</title>

  <!-- 引入 APlayer 与 MetingJS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
  <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>

  <style>
    body {
      background: linear-gradient(to bottom right, #f5f7fa, #dfe9f3);
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
      color: #222;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2c3e50;
    }

    h1::before {
      content: "🎧";
      font-size: 2.2rem;
    }

    #aplayer {
      width: 90%;
      max-width: 720px;
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
    }

    .control-bar {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .control-bar button {
      background-color: #3498db;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 8px rgba(52, 152, 219, 0.3);
    }

    .control-bar button:hover {
      background-color: #2980b9;
      transform: scale(1.1);
    }

    footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>

<body>

  <h1>音乐播放器</h1>

  <div id="aplayer" class="aplayer"></div>

  <div class="control-bar">
    <button onclick="ap.list.switch(ap.list.index - 1)">⏮</button>
    <button onclick="ap.toggle()">⏯</button>
    <button onclick="ap.list.switch(ap.list.index + 1)">⏭</button>
    <button onclick="ap.pause()">⏹</button>
  </div>

  <footer>🎵 由阿里云 OSS 提供存储支持</footer>

  <script>
    // OSS 上的 list.json 路径
    const listUrl = 'https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/mp3/list.json';

    async function loadMusicList() {
      const response = await fetch(listUrl);
      const data = await response.json();

      // 格式化音乐列表

	  const musicList = data.map(item => ({
		name: item.name,
		artist: item.artist || '未知',
		url: item.url,
		cover: item.cover || 'https://cdn.jsdelivr.net/gh/metowolf/assets@master/cover/default.jpg',
		lrc: item.lrc || ''
	  }));


      // 创建播放器实例
      window.ap = new APlayer({
        container: document.getElementById('aplayer'),
        audio: musicList,
        fixed: false,
        mini: false,
        autoplay: false,
        lrcType: 3,
        volume: 0.8,
        theme: '#3498db'
      });
    }

    loadMusicList().catch(err => {
      alert('❌ 加载音乐列表失败，请检查 OSS 是否存在 list.json');
      console.error(err);
    });
  </script>
</body>
</html>
