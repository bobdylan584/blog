title: 🎧 在线音乐播放器
date: 2025-11-04
---

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>🎵 在线音乐播放器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
  <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI","Microsoft YaHei",sans-serif;
      color: #222;
      background: #f0f2f5;
    }
    .player-wrapper {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }
    .bg-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.6);
      z-index: -1;
    }
    .content {
      position: relative;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 10px;
    }
    p.desc {
      color: #ddd;
      margin-bottom: 20px;
    }
    .controls {
      margin-bottom: 20px;
    }
    button {
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 15px;
      cursor: pointer;
      margin: 0 5px;
      transition: background 0.3s;
    }
    button:hover { background: #005fa3; }

    #searchInput {
      padding: 6px 10px;
      font-size: 14px;
      width: 80%;
      max-width: 400px;
      margin-bottom: 20px;
      border: none;
      border-radius: 4px;
    }

    #aplayer {
      margin: 0 auto;
      max-width: 700px;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 10px;
    }

    /* 暗黑模式 */
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eee; }
      button { background: #1e88e5; }
      #aplayer { background: rgba(30,30,30,0.9); }
    }
  </style>
</head>

<body>
  <div class="player-wrapper">
    <div class="bg-cover" id="bgCover"></div>
    <div class="content">
      <h1>🎧 在线音乐播放器</h1>
      <p class="desc">从云端读取音乐列表 & 动态封面大图效果</p>

      <div class="controls">
        <button id="btnReload">🔄 重新加载列表</button>
        <button id="btnMode">🔀 切换模式</button>
      </div>

      <input type="text" id="searchInput" placeholder="🔍 搜索歌曲 / 歌手" />

      <div id="aplayer"></div>
    </div>
  </div>

  <script>
    const listUrl = "https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/mp3/list.json";
    const defaultCover = "https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg";

    const aplayer = new APlayer({
      container: document.getElementById("aplayer"),
      autoplay: false,
      loop: "all",
      order: "random",
      listFolded: false,
      preload: "none",
      fixed: false,
      audio: []
    });

    let originalList = [];

    async function loadMusicList() {
      try {
        const res = await fetch(listUrl + "?v=" + Date.now());
        if (!res.ok) throw new Error("无法加载 list.json");
        const data = await res.json();
        originalList = data.map(item => ({
          title: item.title,
          url: item.url,
          cover: item.cover || defaultCover,
          artist: item.artist || "未知"
        }));
        applyList(originalList);
      } catch (err) {
        alert("加载音乐列表失败，请检查 OSS 配置。");
        console.error(err);
      }
    }

    function applyList(list) {
      aplayer.list.clear();
      list.forEach(item => {
        aplayer.list.add({
          name: item.title,
          artist: item.artist,
          url: item.url,
          cover: item.cover
        });
      });
      // 更新背景封面
      updateBackground(list[0]?.cover || defaultCover);
    }

    function updateBackground(imageUrl) {
      const bg = document.getElementById("bgCover");
      bg.style.backgroundImage = `url("${imageUrl}")`;
    }

    document.getElementById("btnReload").addEventListener("click", () => {
      loadMusicList();
    });

    document.getElementById("btnMode").addEventListener("click", () => {
      const currentOrder = aplayer.config.order;
      aplayer.config.order = (currentOrder === "random" ? "list" : "random");
      alert("播放模式切换为：" + (aplayer.config.order === "random" ? "随机播放" : "顺序播放"));
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = originalList.filter(item => 
        item.title.toLowerCase().includes(q) || item.artist.toLowerCase().includes(q)
      );
      applyList(filtered);
    });

    // 监听播放切换以更新背景
    aplayer.on('play', () => {
      const current = aplayer.list.audios[aplayer.list.index];
      updateBackground(current.cover);
    });

    window.onload = () => {
      loadMusicList();
    };
  </script>
</body>
</html>
