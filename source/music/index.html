<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>🎧 在线音乐播放器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
  <script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f5f5f5 0%, #dfe9f3 100%);
      text-align: center;
      padding: 50px 20px;
      color: #222;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      font-size: 15px;
      margin-bottom: 25px;
    }
    button {
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    button:hover {
      background: #005fa3;
    }
    #aplayer {
      margin: 0 auto;
      max-width: 640px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      border-radius: 10px;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>🎵 在线音乐播放器</h1>
  <p>自动读取阿里云 OSS 上的最新音乐列表</p>
  <button id="reloadBtn">🔄 重新加载音乐列表</button>

  <div id="aplayer"></div>

  <script>
    const listUrl = "https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/mp3/list.json"; // 你的 OSS list.json 路径

    const aplayer = new APlayer({
      container: document.getElementById("aplayer"),
      autoplay: false,
      preload: "none",
      listFolded: false,
      fixed: false,
      order: "random",   // 随机播放
      loop: "all",       // 循环播放
      audio: []
    });

    async function loadMusicList() {
      try {
        const res = await fetch(listUrl + '?_=' + Date.now()); // 强制防缓存
        if (!res.ok) throw new Error('无法加载 list.json');
        const data = await res.json();

        aplayer.list.clear();
        data.forEach(item => {
          aplayer.list.add({
            name: item.title,
            artist: "未知",
            url: item.url,
            cover: "https://bob-blog-image.oss-cn-shanghai.aliyuncs.com/website_background_img/snow_cover.jpg"
          });
        });

        console.log(`✅ 已加载 ${data.length} 首歌曲`);
      } catch (err) {
        console.error("❌ 读取 list.json 出错:", err);
        alert("加载音乐列表失败，请检查 OSS 是否存在 mp3/list.json 并设置为公共读。");
      }
    }

    document.getElementById("reloadBtn").addEventListener("click", loadMusicList);
    loadMusicList();
  </script>
</body>
</html>
